name: Android Release

# Builds a SIGNED APK and publishes it as a GitHub Release when a push to `main` changes the
# NATIVE SHELL. The app reads /releases/latest to power the in-app update popup.
#
# It does NOT release for web changes, and that is the point: capacitor.config.js sets
# server.url, so the APK is a thin shell whose WebView loads the live site over the network.
# Web and backend changes reach users through Vercel on their next app open. Publishing an APK
# for those would prompt everyone to download 5MB of shell identical to what they already have.
# See "When do I need a new APK?" in ANDROID_RELEASE.md.
#
# Why the rest works this way (the previous tag-driven flow kept failing):
#   * the version is computed HERE, so nothing has to be bumped, committed or tagged by hand;
#   * the tag + Release are created by the LAST step, only after a green build — a failed build
#     can no longer leave a published-but-empty tag that has to be deleted by hand;
#   * a pre-flight step fails fast with a readable message when a secret is missing, instead of
#     dying somewhere deep inside Gradle.
#
# Overrides, both read from the SUBJECT LINE only ([skip apk] wins): [skip apk] suppresses a
# release, [force apk] forces one. Scanning the whole message would let a commit that merely
# *mentions* a token trigger it — which is exactly what happened the first time this ran.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_aab:
        description: "Also build the Play Store bundle (.aab)"
        type: boolean
        default: false

permissions:
  contents: write

# Never let two pushes race each other to create the same tag.
concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  # Tiny gate job. It exists because an `if:` expression can't split a string (the skip marker is
  # read from the SUBJECT LINE only) and can't diff a commit range. Costs a few seconds and keeps
  # the reasoning visible on the run page.
  gate:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # a shallow clone can't diff the pushed range

      - name: Should this commit be released?
        id: check
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          decide() { echo "build=$1" >> "$GITHUB_OUTPUT"; echo "$2"; exit 0; }

          # 1. Manual run — always build.
          if [ "${{ github.event_name }}" != "push" ]; then
            decide true "Manual run — building."
          fi

          SUBJECT=$(printf '%s' "$COMMIT_MESSAGE" | head -n 1)

          # 2/3. Explicit overrides in the subject. [skip apk] wins over everything.
          if printf '%s' "$SUBJECT" | grep -qF '[skip apk]'; then
            decide false "Subject carries [skip apk] — no release."
          fi
          if printf '%s' "$SUBJECT" | grep -qF '[force apk]'; then
            decide true "Subject carries [force apk] — releasing even though nothing native changed."
          fi

          # 4. Otherwise release only when the NATIVE SHELL changed. The APK loads the live site
          #    over the network (capacitor.config.js server.url), so web changes reach users
          #    through Vercel on their next app open — publishing an APK for those only prompts
          #    people to download 5MB of identical shell.
          #    package.json counts: Capacitor plugin versions and the MAJOR.MINOR the release
          #    number is built from both live there. package-lock.json does NOT — it churns on
          #    every web-only dependency bump.
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            # New branch or force push: no comparable range. Fail safe by building — a spurious
            # release is recoverable, a silently missed native fix is not.
            decide true "No comparable previous commit — building to be safe."
          fi

          CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}")
          echo "Files changed in this push:"
          printf '%s\n' "$CHANGED" | sed 's/^/  /'

          NATIVE='^(android/|capacitor\.config\.js$|package\.json$|\.github/workflows/android-release\.yml$)'
          if printf '%s\n' "$CHANGED" | grep -qE "$NATIVE"; then
            echo "Native shell files changed:"
            printf '%s\n' "$CHANGED" | grep -E "$NATIVE" | sed 's/^/  /'
            decide true "Releasing."
          fi

          decide false "No native shell files changed — this ships via Vercel and needs no APK. (Use [force apk] in the subject, or Run workflow, to release anyway.)"

  build:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the release-notes check below diffs the pushed range, which a
          # shallow clone cannot do.
          fetch-depth: 0

      - name: Pre-flight — signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # NOT required: capacitor.config.js falls back to the production Vercel URL, so a
          # missing secret here changes nothing about the APK. Only report which URL is used.
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
        run: |
          missing=""
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — add them under Settings → Secrets and variables → Actions (see ANDROID_RELEASE.md). Without them the APK cannot be signed."
            exit 1
          fi
          echo "Signing secrets are present."
          if [ -z "$NEXT_PUBLIC_APP_URL" ]; then
            echo "::warning::NEXT_PUBLIC_APP_URL is not set — the shell will load the fallback URL in capacitor.config.js. Set the secret if your production domain differs."
          else
            echo "Shell will load: $NEXT_PUBLIC_APP_URL"
          fi

      - name: Compute version
        id: version
        run: |
          # MAJOR.MINOR come from package.json; the patch is the CI run number, so every build
          # gets a version strictly higher than the last with nothing to bump by hand. Edit
          # package.json's version to roll MAJOR/MINOR (e.g. "1.2.0" -> releases become 1.2.x).
          BASE=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          VERSION="$BASE.${{ github.run_number }}"
          # versionCode must increase forever. The offset keeps it clear of the hand-managed
          # codes (up to 4) used before this workflow existed.
          VERSION_CODE=$(( 1000 + ${{ github.run_number }} ))
          echo "version=$VERSION"           >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Building v$VERSION (versionCode $VERSION_CODE)"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # >=22 is a hard requirement of the Capacitor CLI ("cap sync" aborts on 20).
          node-version: 22
          cache: npm

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Capacitor 8 generates android/app/capacitor.build.gradle with
          # source/targetCompatibility VERSION_21, so JDK 17 fails to compile
          # capacitor-android with "invalid source release: 21".
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Stamp the version (not committed — the artefact carries it)
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          # package.json first: capacitor.config.js reads it during `cap sync` to stamp the
          # "RentMasterApp/<version>" user-agent the web bundle uses to detect the installed build.
          node -e "const f='package.json',p=require('./'+f);p.version=process.env.VERSION;require('fs').writeFileSync(f,JSON.stringify(p,null,2)+'\n')"
          sed -i "s/versionCode .*/versionCode ${VERSION_CODE}/"    android/app/build.gradle
          sed -i "s/versionName \".*\"/versionName \"${VERSION}\"/"  android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Capacitor sync (bakes the production web URL into the shell)
        run: npx cap sync android
        env:
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}

      - name: Write google-services.json (if provided as a secret)
        env:
          FIREBASE_GOOGLE_SERVICES: ${{ secrets.FIREBASE_GOOGLE_SERVICES }}
        run: |
          if [ -n "$FIREBASE_GOOGLE_SERVICES" ]; then
            echo "$FIREBASE_GOOGLE_SERVICES" > android/app/google-services.json
            echo "Wrote google-services.json from secret."
          elif [ -f android/app/google-services.json ]; then
            echo "Using committed google-services.json."
          else
            echo "::warning::No google-services.json — the build will succeed but push won't work."
          fi

      - name: Decode keystore + write signing config
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/rentmaster-release.jks
          cat > android/keystore.properties <<EOF
          storeFile=../rentmaster-release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build signed APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      # The .aab is only needed for a Play Store upload, so it's off by default — it roughly
      # doubles the Gradle step for an artefact nobody downloads from the Releases page.
      - name: Build Play Store bundle (.aab)
        if: inputs.build_aab
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon

      # Built from what's actually on disk, so the optional .aab never turns into a
      # "file not found" that fails an otherwise perfect release.
      - name: Collect release assets
        id: assets
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          if [ ! -f "$APK" ]; then
            echo "::error::Gradle succeeded but $APK is missing."
            exit 1
          fi
          {
            echo 'list<<ASSETS_EOF'
            echo "$APK"
            if [ -f "$AAB" ]; then echo "$AAB"; fi
            echo 'ASSETS_EOF'
          } >> "$GITHUB_OUTPUT"

      # RELEASE_NOTES.md is the release body AND the "What's new" text users read in the in-app
      # update popup, so a push that forgets it republishes the PREVIOUS release's bullets.
      # Warning only — it must never block a release.
      - name: Check the release notes were updated
        if: github.event_name == 'push'
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "No comparable previous commit — skipping the check."
            exit 0
          fi
          if git diff --name-only "$BEFORE" "${{ github.sha }}" | grep -qx 'RELEASE_NOTES.md'; then
            echo "RELEASE_NOTES.md was updated in this push."
          else
            echo "::warning::RELEASE_NOTES.md was not updated — this release republishes the previous release's notes, so users will see changes they already have."
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # The action creates the tag itself, pointing at this commit — AFTER a green build.
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          # RELEASE_NOTES.md, NOT generate_release_notes. GitHub builds generated notes from
          # merged pull requests; this repo pushes straight to main, so there are none and the
          # body collapses to a bare "Full Changelog" link — which is exactly what the update
          # popup then showed instead of bullets. Keep this as body_path.
          body_path: RELEASE_NOTES.md
          # Keep the app-release.apk filename: lib/app-config.ts builds the permanent
          # /releases/latest/download/app-release.apk URL from it.
          files: ${{ steps.assets.outputs.list }}
